name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project
      run: |
        unzip -q -o Castpedia.zip
        ls

    - name: Locate Gradle project
      run: |
        FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
        if [ -z "$FILE" ]; then
          echo "settings.gradle.kts introuvable"
          exit 1
        fi
        DIR=$(dirname "$FILE")
        echo "Projet Gradle trouve dans : $DIR"
        echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

    - name: Apply patch files
      run: |
        if [ -d patch ]; then
          cp -r patch/. "$PROJECT_DIR"/
          echo "Fichiers patch appliques :"
          find patch -type f
        else
          echo "Pas de dossier patch"
        fi

    - name: Download sherpa-onnx AAR
      run: |
        mkdir -p "$PROJECT_DIR/app/libs"
        curl -L --fail -o "$PROJECT_DIR/app/libs/sherpa-onnx-static-link-onnxruntime-1.12.40.aar" \
          https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.40/sherpa-onnx-static-link-onnxruntime-1.12.40.aar

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK with Gradle
      run: |
        cd "$PROJECT_DIR"
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Castpedia-APK
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
