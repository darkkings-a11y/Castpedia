name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip and organize project files
      run: |
        echo "=== VÉRIFICATION DU ZIP ==="
        if [ -f "Castpedia.zip" ]; then
          echo "Le fichier Castpedia.zip est bien présent."
        else
          echo "ERREUR : Le fichier Castpedia.zip est introuvable à la racine !"
          exit 1
        fi
        unzip -o Castpedia.zip -d extracted
        APP_DIR=$(find extracted -name app -type d | head -n 1)
        if [ -n "$APP_DIR" ]; then
          PROJECT_DIR=$(dirname "$APP_DIR")
          cp -r "$PROJECT_DIR"/* .
          cp -r "$PROJECT_DIR"/.[!.]* . 2>/dev/null || true
          echo "Fichiers du ZIP extraits avec succès."
        else
          echo "ERREUR : Impossible de trouver le dossier 'app' dans le ZIP."
          exit 1
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Modern Gradle (8.5)
      run: |
        wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build APK with Gradle (Capture des logs)
      run: |
        ./gradlew assembleDebug --stacktrace > gradle_output.log 2>&1 || {
          echo "=== LE BUILD A ÉCHOUÉ ==="
          cat gradle_output.log | tail -n 100
          exit 1
        }

    - name: Upload Build Error Logs (si échec)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-error-logs
        path: gradle_output.log

    - name: Upload APK Artifact (si succès)
      uses: actions/upload-artifact@v4
      with:
        name: Castpedia-APK
        path: app/build/outputs/apk/debug/app-debug.apk
